name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e-guard:
    name: E2E coverage guard
    runs-on: ubuntu-latest
    # Corre sempre em pull_request — o short-circuit do label skip-e2e é feito
    # dentro do step, não pela condição do job. Um job saltado por `if:` reporta
    # conclusion "skipped" ao Checks API, e branch protection NÃO trata
    # "skipped" como um required status check satisfeito: o PR fica bloqueado
    # em "blocked"/pending para sempre. Reportar sempre success/failure evita isso.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check E2E coverage
        env:
          SKIP_E2E: ${{ contains(github.event.pull_request.labels.*.name, 'skip-e2e') }}
        run: |
          if [ "$SKIP_E2E" = "true" ]; then
            echo "⏭️  Label 'skip-e2e' presente — a ignorar a verificação de cobertura E2E."
            exit 0
          fi
          bash ci/check-e2e-coverage.sh

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # HARDSTYLE-006 ratchet. Secretless: reads only this checkout plus the
      # committed hardcoded-styles.baseline.json at the base revision (PR base
      # / push "before"), fetched here at depth 1. Never regenerates the
      # baseline. Fails on new or increased ENFORCED_V1 debt, and on any
      # growth of the baseline itself relative to the base revision; an
      # unavailable base revision fails closed.
      - name: Fetch baseline base revision
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: Hardcoded style ratchet (new debt, multiplicity, baseline growth)
        env:
          HARDSTYLE_BASELINE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:hardcoded-styles -- --require-baseline-base

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Secretless — reads only the committed vendor/ snapshot, never
      # PORTIFY-KNOWLEDGE directly. See scripts/check-design-tokens.mjs and
      # the Tranche 1B design record for why this is deliberately NOT proof
      # that Knowledge has published nothing newer (that's the privileged
      # sync workflow's job, .github/workflows/sync-design-tokens.yml).
      - name: Design tokens check (schema, provenance, contentHash, determinism, drift)
        run: npm run check:design-tokens

      # Secretless, like the token check above: reads only the committed
      # vendor/brand/ snapshot, vendor/brand.lock.json, brand-consumption.json
      # and the bound runtime targets — never PORTIFY-KNOWLEDGE. Upstream
      # freshness is the privileged sync workflow's job (Brand Consumer
      # Contract v1, DS-RUNTIME-002 T1 / APP_BRAND_VERSION_CHECK).
      - name: Brand assets check (snapshot, contentHash, lock, bindings)
        run: npm run check:brand-assets

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: E2E tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://supabase.test
          NEXT_PUBLIC_SUPABASE_ANON_KEY: fake-anon-key
